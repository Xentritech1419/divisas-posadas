name: Verificar y empaquetar Divisas Posadas
on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Si entran dos cambios seguidos, el empaquetado más reciente es el vigente.
concurrency:
  group: divisas-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas-y-paquete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: PHP CLI
        run: php --version
      - name: Diagnóstico del ZIP anterior
        run: python3 scripts/check-package.py --report-only
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas de lógica
        run: npm run test:logic
      - name: Compilar el sitio
        run: npm run build
      - name: Pruebas de API PHP
        run: npm run test:api
      - name: Empaquetar para Hostinger
        run: python3 scripts/make-zip.py
      - name: Comprobar mejoras en el ZIP real
        run: python3 scripts/check-package.py
      # El ZIP se publica desde el último código fusionado a main,
      # nunca desde una compilación anterior de una rama de revisión.
      - name: Publicar ZIP completo en main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/divisas-posadas-hostinger.zip deploy/SHA256SUMS.txt server/api/default-content.json
          if ! git diff --cached --quiet; then
            git commit -m "build: publicar ZIP verificado de Hostinger"
            git push origin HEAD:main
          fi
      - name: Publicar ZIP de prueba
        uses: actions/upload-artifact@v4
        with:
          name: divisas-posadas-hostinger
          path: |
            deploy/divisas-posadas-hostinger.zip
            deploy/SHA256SUMS.txt
          retention-days: 14
