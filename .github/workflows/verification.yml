name: Verificar y empaquetar Divisas Posadas
on:
  push:
    branches:
      - chatgpt/admin-users-rates-whatsapp
      - chatgpt/usdt-currency-icons
      - chatgpt/monedas-personalizadas
      - chatgpt/favicon-cache-refresh
      - chatgpt/favicon-fondo-blanco
      - chatgpt/mobile-rate-cards-single-column
      - chatgpt/cambiar-contrasena-administradores
      - chatgpt/logo-chat-asistente
      - chatgpt/live-chat-inbox-whatsapp
      - chatgpt/guaranies-por-peso
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pruebas-y-paquete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: PHP CLI
        run: php --version
      - name: Instalar dependencias
        run: npm ci
      - name: Pruebas de lógica
        run: npm run test:logic
      - name: Compilar el sitio
        run: npm run build
      - name: Pruebas de API PHP
        run: npm run test:api
      - name: Empaquetar para Hostinger
        run: python3 scripts/make-zip.py
      - name: Mantener actualizado el ZIP de la rama de revisión
        if: github.event_name == 'push' && (github.ref == 'refs/heads/chatgpt/admin-users-rates-whatsapp' || github.ref == 'refs/heads/chatgpt/usdt-currency-icons' || github.ref == 'refs/heads/chatgpt/monedas-personalizadas' || github.ref == 'refs/heads/chatgpt/favicon-cache-refresh' || github.ref == 'refs/heads/chatgpt/favicon-fondo-blanco' || github.ref == 'refs/heads/chatgpt/mobile-rate-cards-single-column' || github.ref == 'refs/heads/chatgpt/cambiar-contrasena-administradores' || github.ref == 'refs/heads/chatgpt/logo-chat-asistente' || github.ref == 'refs/heads/chatgpt/live-chat-inbox-whatsapp' || github.ref == 'refs/heads/chatgpt/guaranies-por-peso')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/divisas-posadas-hostinger.zip deploy/SHA256SUMS.txt server/api/default-content.json
          if ! git diff --cached --quiet; then
            git commit -m "build: actualizar paquete compilado para Hostinger"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Publicar ZIP de prueba
        uses: actions/upload-artifact@v4
        with:
          name: divisas-posadas-hostinger
          path: |
            deploy/divisas-posadas-hostinger.zip
            deploy/SHA256SUMS.txt
          retention-days: 14
